[package]
name = "graphqa"
version = "0.1.0"
description = "IDE GraphQL pensé pour le QA"
authors = ["t1gu1"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "graphqa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
